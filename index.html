<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shinobi Clash</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>


<div class="game">


<!-- BACKGROUND -->

<div class="background"></div>

<img src="assets/moon.png" class="moon">

<img src="assets/village-lights.png" class="village">

<img src="assets/fog.png" class="fog">





<!-- HEADER -->

<div class="header">

<img src="assets/logo.png">

<button>
↻
</button>

</div>






<!-- ENEMY BAR -->

<section class="enemy-panel">


<div class="portrait">

<img src="assets/shadowwolf.png">

</div>


<div class="info">

<h1>SHADOWWOLF</h1>

<p>JŌNIN • LV.15</p>


<div class="chakra">

<span>CHAKRA</span>

<div class="bar">

<div></div>

</div>


<b>48</b>


</div>


</div>



<div class="enemy-cards">

<img src="assets/card-back.png">
<img src="assets/card-back.png">
<img src="assets/card-back.png">
<img src="assets/card-back.png">
<img src="assets/card-back.png">


</div>


</section>






<!-- TURN -->


<div class="turn enemy-turn">

◉ SHADOWWOLF TURN

</div>







<!-- CENTER FIELD -->


<div class="field">


<div class="pile">

<img src="assets/card-back.png">

<label>
DRAW PILE
</label>

<b>
12
</b>

</div>






<div class="active">


<img src="assets/card-frame-blue.png">


<img src="assets/lightning.png" class="element">


<strong>
7
</strong>


<span>
CHAKRA
</span>


</div>






<div class="pile">


<img src="assets/fire.png">

<label>
DISCARD PILE
</label>

<b>
3
</b>


</div>



</div>







<!-- PLAYER BAR -->

<section class="player-panel">


<div class="portrait">

<img src="assets/emmanuel.png">

</div>


<div class="info">


<h1>EMMANUEL</h1>

<p>CHŪNIN • LV.12</p>



<div class="chakra">

<span>CHAKRA</span>

<div class="bar blue">

<div></div>

</div>


<b>
62
</b>


</div>


</div>




</section>








<!-- HAND -->

<div class="hand">


<div class="card">

<img src="assets/card-frame-blue.png">

<img src="assets/wind.png">

</div>



<div class="card">

<img src="assets/card-frame-red.png">

<img src="assets/fire.png">

</div>



<div class="card">

<img src="assets/card-frame-blue.png">

<img src="assets/lightning.png">

</div>



<div class="card">

<img src="assets/card-frame-blue.png">

<img src="assets/water.png">

</div>



<div class="card">

<img src="assets/card-frame-purple.png">

<img src="assets/jutsu.png">

</div>



<div class="card">

<img src="assets/card-frame-gold.png">

<img src="assets/earth.png">

</div>


</div>








<!-- BUTTONS -->


<div class="buttons">

<button>
DRAW CARD
</button>

<button class="play">
▶ PLAY CARD
</button>

<button>
⚡ USE JUTSU
</button>

<button>
✦ KAGE ABILITY
</button>


</div>




</div>


<script src="app.js"></script>


</body>

</html>
