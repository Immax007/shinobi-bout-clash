<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Shinobi Clash</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>


<div class="game-screen">


<!-- BACKGROUND -->

<div class="battle-bg"></div>

<img src="assets/moon.png" class="moon">

<img src="assets/mountains-back.png" class="mountain-back">

<img src="assets/mountains-front.png" class="mountain-front">

<img src="assets/village-lights.png" class="village">

<img src="assets/fog.png" class="fog">





<!-- TOP HEADER -->

<div class="top-header">


<img src="assets/logo.png" class="logo">


<button class="restart">
↻
</button>


</div>






<!-- ENEMY AREA -->

<div class="enemy-hud">


<div class="portrait red">

<img src="assets/shadowwolf.png">

</div>



<div class="name-box">


<h2>SHADOWWOLF</h2>

<p>JŌNIN • LV.15</p>


<div class="chakra">

<span>CHAKRA</span>

<div class="chakra-track">

<div class="enemy-energy"></div>

</div>


<b>48</b>


</div>


</div>




<div class="enemy-hand">


<img src="assets/card-back.png">

<img src="assets/card-back.png">

<img src="assets/card-back.png">

<img src="assets/card-back.png">

<img src="assets/card-back.png">


</div>


</div>






<!-- TURN -->


<div class="turn enemy-turn">

◉ SHADOWWOLF TURN

</div>







<!-- CENTER TABLE -->


<div class="battle-table">



<div class="pile">

<img src="assets/card-back.png">

<label>DRAW PILE</label>

<strong>12</strong>

</div>





<div class="active-card">

<img src="assets/card-frame-blue.png">


<img src="assets/lightning.png" class="element">


<div class="number">

7

</div>


<span>CHAKRA</span>


</div>






<div class="pile discard">


<img src="assets/fire.png">

<label>DISCARD PILE</label>

<strong>3</strong>


</div>



</div>








<!-- YOUR TURN -->


<div class="turn player-turn">

✦ YOUR TURN

</div>








<!-- PLAYER HUD -->


<div class="player-hud">



<div class="portrait blue">


<img src="assets/emmanuel.png">


</div>




<div class="name-box">


<h2>EMMANUEL</h2>

<p>CHŪNIN • LV.12</p>


<div class="chakra">

<span>CHAKRA</span>


<div class="chakra-track">

<div class="player-energy"></div>


</div>


<b>62</b>


</div>


</div>


</div>









<!-- HAND -->

<div class="player-hand">


<div class="card">

<img src="assets/card-frame-blue.png">

<img src="assets/wind.png">

<h3>WIND</h3>

</div>



<div class="card">

<img src="assets/card-frame-red.png">

<img src="assets/fire.png">

<h3>FIRE</h3>

</div>




<div class="card">

<img src="assets/card-frame-blue.png">

<img src="assets/lightning.png">

<h3>CHIDORI</h3>

</div>




<div class="card">

<img src="assets/card-frame-blue.png">

<img src="assets/water.png">

<h3>WATER</h3>

</div>




<div class="card">

<img src="assets/card-frame-purple.png">

<img src="assets/jutsu.png">

<h3>RASENGAN</h3>

</div>




<div class="card">

<img src="assets/card-frame-gold.png">

<img src="assets/earth.png">

<h3>EARTH</h3>

</div>


</div>









<!-- ACTIONS -->


<div class="actions">


<button>
DRAW CARD
</button>


<button class="play">
PLAY CARD
</button>


<button>
⚡ JUTSU
</button>


<button>
✦ KAGE
</button>


</div>




</div>


<script src="app.js"></script>


</body>

</html>
