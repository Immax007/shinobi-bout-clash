<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shinobi Clash</title>

</head>


<body>


<div class="game-screen">

12

<div class="battle-card">

3

<div class="fighter-card player">


<img 
class="avatar"
src="assets/emmanuel.png"
>

62

</div>
