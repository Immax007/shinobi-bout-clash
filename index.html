<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shinobi Clash</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="game">


<!-- BACKGROUND LAYERS -->

<div class="sky"></div>
<img class="moon" src="assets/moon.png">
<img class="mountain back" src="assets/mountains-back.png">
<img class="mountain front" src="assets/mountains-front.png">
<img class="village" src="assets/village-lights.png">
<img class="fog" src="assets/fog.png">


<!-- HEADER -->

<header>

<img src="assets/logo.png" class="logo">

<button class="restart">
↻
</button>

</header>



<!-- ENEMY -->

<section class="fighter enemy">

<img src="assets/shadowwolf.png" class="avatar">


<div class="fighter-info">

<h2>SHADOWWOLF</h2>

<p>JŌNIN • LV 15</p>


<div class="chakra-bar">

<span>CHAKRA</span>

<div>
<b></b>
</div>

<strong>
48
</strong>

</div>

</div>


<div class="hand-count">

CARDS

<h2>
5
</h2>

</div>


</section>



<div class="turn enemy-turn">

◉ SHADOWWOLF TURN

</div>





<!-- BATTLEFIELD -->

<section class="arena">


<div class="deck">

<img src="assets/card-back.png">

<p>DRAW</p>

<b>12</b>

</div>



<div class="active-card">

<img src="assets/card-frame-blue.png">


<div class="card-content">

<img src="assets/lightning.png">

<h2>
7
</h2>

<p>
CHAKRA
</p>

</div>


</div>




<div class="discard">

<div class="mini-card">

<img src="assets/card-frame-red.png">

<img src="assets/fire.png">

</div>


<p>DISCARD</p>

<b>3</b>

</div>


</section>





<!-- PLAYER -->

<section class="fighter player">


<img src="assets/emmanuel.png" class="avatar">


<div class="fighter-info">

<h2>EMMANUEL</h2>

<p>CHŪNIN • LV 12</p>


<div class="chakra-bar blue">

<span>CHAKRA</span>

<div>
<b></b>
</div>

<strong>
62
</strong>

</div>


</div>


</section>





<!-- PLAYER HAND -->

<section class="cards">


<div class="card wind">

<img src="assets/card-frame-blue.png">

<img src="assets/wind.png">

<h3>
WIND
</h3>

</div>




<div class="card fire">

<img src="assets/card-frame-red.png">

<img src="assets/fire.png">

<h3>
FIRE
</h3>

</div>




<div class="card lightning">

<img src="assets/card-frame-purple.png">

<img src="assets/lightning.png">

<h3>
CHIDORI
</h3>

</div>




<div class="card water">

<img src="assets/card-frame-blue.png">

<img src="assets/water.png">

<h3>
WATER
</h3>

</div>




<div class="card jutsu">

<img src="assets/card-frame-gold.png">

<img src="assets/jutsu.png">

<h3>
JUTSU
</h3>

</div>




<div class="card earth">

<img src="assets/card-frame-gold.png">

<img src="assets/earth.png">

<h3>
EARTH
</h3>

</div>


</section>





<!-- ACTION BUTTONS -->

<footer>


<button>
DRAW CARD
</button>


<button class="play">
▶ PLAY CARD
</button>


<button>
⚡ JUTSU
</button>


<button>
✦ KAGE
</button>


</footer>



</div>



<script src="app.js"></script>


</body>
</html>
